name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (client + shared)
        run: npm run check
      - name: Typecheck (server)
        run: npx tsc -p tsconfig.server.json --noEmit
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
